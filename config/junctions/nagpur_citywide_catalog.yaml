# Nagpur city-wide operating catalogue. Coordinates are junction centroids for
# planning/simulation; field commissioning must replace them with surveyed values.
standard_approaches: &standard_approaches
  - { id: "APP_NORTH", name: "North approach", direction: "Northbound", camera_source: "rtsp://commissioning-required/north", lanes: 2, saturation_flow_pcu_hr: 1500 }
  - { id: "APP_SOUTH", name: "South approach", direction: "Southbound", camera_source: "rtsp://commissioning-required/south", lanes: 2, saturation_flow_pcu_hr: 1500 }
  - { id: "APP_EAST", name: "East approach", direction: "Eastbound", camera_source: "rtsp://commissioning-required/east", lanes: 2, saturation_flow_pcu_hr: 1500 }
  - { id: "APP_WEST", name: "West approach", direction: "Westbound", camera_source: "rtsp://commissioning-required/west", lanes: 2, saturation_flow_pcu_hr: 1500 }
standard_phases: &standard_phases
  - { phase_id: 1, name: "North–south movement", active_approaches: ["APP_NORTH", "APP_SOUTH"], conflicting_phases: [2] }
  - { phase_id: 2, name: "East–west movement", active_approaches: ["APP_EAST", "APP_WEST"], conflicting_phases: [1] }

